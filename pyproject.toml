[project]
name = "llmpvp-adversarial-agents"
version = "0.1.0"
description = "Adversarial cheater-profile move generators and mock server for LLMPvP anti-cheat research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.10",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
go = ["open_spiel>=1.5"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
